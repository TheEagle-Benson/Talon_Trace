<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Talon Trace | Trail Details</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app" id="app">
  <section class="screen is-active" id="screen-trail-detail" aria-label="Trail Details">

    <div class="detail-map-wrap">
      <!-- Real Leaflet map (saved route) mounts here later -->
      <div id="trailDetailMap" class="map-surface">
        <div class="map-surface__grid"></div>
        <div class="map-surface__contours">
          <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <path d="M-20 240 C 60 210, 100 260, 180 230 S 300 190, 420 220" stroke="#3FC9A8" stroke-width="1" fill="none" opacity="0.3"/>
          </svg>
        </div>
        <svg class="map-surface__path" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <path d="M60 250 L100 200 L90 150 L150 120 L180 70 L250 50 L300 30" stroke="#D9922E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="60" cy="250" r="7" fill="#3FC9A8" stroke="#0B0F14" stroke-width="2.5"/>
          <circle cx="300" cy="30" r="7" fill="#D9922E" stroke="#0B0F14" stroke-width="2.5"/>
        </svg>
        <div class="map-surface__badge">Dad's Place Trail</div>
      </div>
      <div class="detail-map-fade"></div>
      <header class="top-header" style="position:absolute; top:0; left:0; right:0; background:none; backdrop-filter:none;">
        <button class="top-header__back" id="detailBackBtn" data-demo-nav-target="screen-trails" aria-label="Back to trails">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span style="flex:1;"></span>
        <button class="top-header__action" id="detailShareBtn" aria-label="Share trail" style="background: rgba(16,22,29,0.75); border:1px solid var(--ink-700); border-radius:50%;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M18 8a3 3 0 100-6 3 3 0 000 6zM6 15a3 3 0 100-6 3 3 0 000 6zM18 22a3 3 0 100-6 3 3 0 000 6zM8.6 13.5l6.8-4M8.6 10.5l6.8 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </header>
    </div>

    <div class="detail-body">
      <div class="detail-title-row">
        <div>
          <h2 id="detailTrailName">Dad's Place Trail</h2>
          <div class="detail-date" id="detailTrailDate">Recorded Aug 16, 2026 · 4:12 PM</div>
        </div>
        <button class="detail-fav-btn" id="detailFavoriteBtn" aria-label="Mark as favorite">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 17.3l-5.4 3.2 1.3-6.1L3 9.9l6.2-.6L12 3.5l2.8 5.8 6.2.6-4.9 4.5 1.3 6.1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="detail-stats-grid detail-stats-grid--four">
        <div class="detail-stat">
          <div class="detail-stat__value" id="detailDistance">1.24<span class="unit">km</span></div>
          <div class="detail-stat__label">Distance</div>
        </div>
        <div class="detail-stat">
          <div class="detail-stat__value" id="detailDuration">28<span class="unit">min</span></div>
          <div class="detail-stat__label">Duration</div>
        </div>
        <div class="detail-stat">
          <div class="detail-stat__value" id="detailPoints">36</div>
          <div class="detail-stat__label">Points</div>
        </div>
        <div class="detail-stat">
          <div class="detail-stat__value" id="detailAccuracy">±4<span class="unit">m</span></div>
          <div class="detail-stat__label">GPS Accuracy</div>
        </div>
      </div>

      <div class="detail-legend">
        <span class="detail-legend__item"><span class="detail-legend__dot dot-start"></span>Start point</span>
        <span class="detail-legend__item"><span class="detail-legend__dot dot-end"></span>End point</span>
      </div>

      <div class="notes-box">
        <div class="notes-box__label">Notes</div>
        <p id="detailNotesText">Path through the bush behind the old cocoa farm — keep left at the fork near the stream.</p>
      </div>

      <div class="detail-actions">
        <button class="btn btn--primary" id="followTrailBtn" data-demo-nav-target="screen-record">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21l2-7.5L2 9h7z" stroke="currentColor" stroke-width="0" fill="currentColor" opacity="0"/><path d="M4 20 L10 12 L14 15 L20 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="6" r="2" fill="currentColor"/></svg>
          Follow This Trail
        </button>
        <div class="detail-actions-row">
          <button class="btn btn--secondary" id="exportGpxBtn">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Export GPX
          </button>
          <button class="btn btn--secondary" id="detailNotesEditBtn">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Edit Notes
          </button>
        </div>
        <button class="btn btn--danger" id="deleteTrailBtn">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m-8 0l1 13h8l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Delete Trail
        </button>
      </div>
    </div>
  </section>
  <!-- ==================== BOTTOM NAVIGATION ==================== -->
<nav class="bottom-nav" aria-label="Primary">

  <a href="home.html"
     class="nav-btn is-active"
     data-nav-id="home"
     aria-label="Home">
    <span class="nav-btn__indicator"></span>

    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M4 11.5L12 4l8 7.5M6 10v9h12v-9"
        stroke="currentColor"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"/>
    </svg>

    <span class="nav-btn__label">Home</span>
  </a>


  <a href="trails.html"
     class="nav-btn"
     data-nav-id="trails"
     aria-label="My Trails">
    <span class="nav-btn__indicator"></span>

    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M4 19 L9 10 L12 14 L16 6 L20 19"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"/>
    </svg>

    <span class="nav-btn__label">Trails</span>
  </a>


  <a href="record.html"
     class="nav-btn nav-btn--record"
     data-nav-id="record"
     aria-label="Record new trail">

    <span class="nav-btn__record-circle">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle
          cx="12"
          cy="12"
          r="9"
          stroke="currentColor"
          stroke-width="2"/>

        <circle
          cx="12"
          cy="12"
          r="3.5"
          fill="currentColor"/>
      </svg>
    </span>

    <span class="nav-btn__label">Record</span>
  </a>


  <a href="offline.html"
     class="nav-btn"
     data-nav-id="offline"
     aria-label="Offline maps">
    <span class="nav-btn__indicator"></span>

    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2V6z"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linejoin="round"/>
    </svg>

    <span class="nav-btn__label">Maps</span>
  </a>


  <a href="settings.html"
     class="nav-btn"
     data-nav-id="settings"
     aria-label="Settings">
    <span class="nav-btn__indicator"></span>

    <svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13a7.6 7.6 0 000-2l2-1.5-2-3.4-2.3.9a7.6 7.6 0 00-1.7-1L15 3.5h-4l-.4 2.5a7.6 7.6 0 00-1.7 1l-2.3-.9-2 3.4L6.6 11a7.6 7.6 0 000 2l-2 1.5 2 3.4 2.3-.9c.5.4 1.1.75 1.7 1l.4 2.5h4l.4-2.5c.6-.25 1.2-.6 1.7-1l2.3.9 2-3.4-2-1.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>

    <span class="nav-btn__label">Settings</span>
  </a>

</nav>
  </div>
</body>
</html>
