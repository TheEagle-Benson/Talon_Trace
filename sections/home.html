 <!DOCTYPE html>
 <html lang="en">
 <head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta http-equiv="X-UA-Compatible" content="ie=edge">
   <title>Talon Trace | Home</title>
   <link rel="stylesheet" href="../css/style.css">
 </head>
 <body>
  <div class="app" id="app">
  <section class="screen is-active" id="screen-home" aria-label="Home">

    <header class="home-header">
      <div class="wordmark">
        <svg class="wordmark__mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <circle cx="20" cy="20" r="19" stroke="#D9922E" stroke-width="1.4" opacity="0.35"/>
          <path d="M11 27 L20 9 L29 27" stroke="#D9922E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M20 9 L20 30" stroke="#3FC9A8" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0.5 4.5"/>
          <circle cx="20" cy="30" r="2.2" fill="#3FC9A8"/>
        </svg>
        <span class="wordmark__text"><b>Talon</b> Trace</span>
      </div>
      <div class="gps-pill" id="gpsStatusIndicator">
        <span class="gps-pill__dot"></span>
        GPS Ready
      </div>
    </header>

    <div class="hero-panel">
      <svg class="hero-panel__trace" viewBox="0 0 150 150" fill="none" aria-hidden="true">
        <path d="M20 130 L45 90 L40 60 L70 45 L85 20 L120 15" stroke="#D9922E" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>
        <circle cx="20" cy="130" r="4" fill="#3FC9A8"/>
        <circle cx="120" cy="15" r="4" fill="#D9922E"/>
      </svg>
      <div class="hero-panel__eyebrow">Ready when you are</div>
      <h1 class="hero-panel__title">Trace a path you can always find again.</h1>
      <a href="record.html" class="btn btn--primary hero-panel__cta" id="startTrailHomeBtn">
        <svg class="hero-panel__cta-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>
        Start New Trail
      </a>
    </div>

    <div class="stat-strip">
      <div class="stat-chip">
        <div class="stat-chip__value" id="statTotalTrails">14</div>
        <div class="stat-chip__label">Trails saved</div>
      </div>
      <div class="stat-chip">
        <div class="stat-chip__value" id="statTotalDistance">38.6<span class="unit">km</span></div>
        <div class="stat-chip__label">Total traced</div>
      </div>
      <div class="stat-chip">
        <div class="stat-chip__value" id="statOfflineAreas">2</div>
        <div class="stat-chip__label">Offline areas</div>
      </div>
    </div>

    <div class="quick-row">
      <a href="trails.html" class="quick-tile" id="quickMyTrailsBtn">
        <span class="quick-tile__icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span class="quick-tile__label">My Trails</span>
        <span class="quick-tile__sub">14 recorded</span>
      </a>
      <a href="offline.html" class="quick-tile" id="quickOfflineMapsBtn">
        <span class="quick-tile__icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2V6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </span>
        <span class="quick-tile__label">Offline Maps</span>
        <span class="quick-tile__sub">2 downloaded</span>
      </a>
    </div>

    <div class="section-heading">
      <span class="section-heading__title">Recent Trails</span>
      <a href="trails.html" class="section-heading__action" >See all</a>
    </div>

    <div class="recent-list">
      <button class="recent-item" data-demo-nav-target="screen-trail-detail">
        <span class="recent-item__glyph">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 19 L9 10 L12 14 L16 6 L20 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="recent-item__body">
          <span class="recent-item__name">Dad's Place Trail</span>
          <span class="recent-item__meta">1.24 km · 36 pts · Aug 16</span>
        </span>
        <svg class="recent-item__chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <button class="recent-item" data-demo-nav-target="screen-trail-detail">
        <span class="recent-item__glyph">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 19 L9 10 L12 14 L16 6 L20 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="recent-item__body">
          <span class="recent-item__name">Morning Walk</span>
          <span class="recent-item__meta">0.86 km · 22 pts · Aug 14</span>
        </span>
        <svg class="recent-item__chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <button class="recent-item" data-demo-nav-target="screen-trail-detail">
        <span class="recent-item__glyph">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 19 L9 10 L12 14 L16 6 L20 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="recent-item__body">
          <span class="recent-item__name">Bush Path</span>
          <span class="recent-item__meta">2.31 km · 58 pts · Aug 9</span>
        </span>
        <svg class="recent-item__chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="bottom-spacer"></div>
  </section>
  <!-- ==================== BOTTOM NAVIGATION ==================== -->
<nav class="bottom-nav" aria-label="Primary">

  <a href="home.html"
     class="nav-btn is-active"
     data-nav-id="home"
     aria-label="Home">
    <span class="nav-btn__indicator"></span>

    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M4 11.5L12 4l8 7.5M6 10v9h12v-9"
        stroke="currentColor"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"/>
    </svg>

    <span class="nav-btn__label">Home</span>
  </a>


  <a href="trails.html"
     class="nav-btn"
     data-nav-id="trails"
     aria-label="My Trails">
    <span class="nav-btn__indicator"></span>

    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M4 19 L9 10 L12 14 L16 6 L20 19"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"/>
    </svg>

    <span class="nav-btn__label">Trails</span>
  </a>


  <a href="record.html"
     class="nav-btn nav-btn--record"
     data-nav-id="record"
     aria-label="Record new trail">

    <span class="nav-btn__record-circle">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle
          cx="12"
          cy="12"
          r="9"
          stroke="currentColor"
          stroke-width="2"/>

        <circle
          cx="12"
          cy="12"
          r="3.5"
          fill="currentColor"/>
      </svg>
    </span>

    <span class="nav-btn__label">Record</span>
  </a>


  <a href="offline.html"
     class="nav-btn"
     data-nav-id="offline"
     aria-label="Offline maps">
    <span class="nav-btn__indicator"></span>

    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2V6z"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linejoin="round"/>
    </svg>

    <span class="nav-btn__label">Maps</span>
  </a>


  <a href="settings.html"
     class="nav-btn"
     data-nav-id="settings"
     aria-label="Settings">
    <span class="nav-btn__indicator"></span>

    <svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13a7.6 7.6 0 000-2l2-1.5-2-3.4-2.3.9a7.6 7.6 0 00-1.7-1L15 3.5h-4l-.4 2.5a7.6 7.6 0 00-1.7 1l-2.3-.9-2 3.4L6.6 11a7.6 7.6 0 000 2l-2 1.5 2 3.4 2.3-.9c.5.4 1.1.75 1.7 1l.4 2.5h4l.4-2.5c.6-.25 1.2-.6 1.7-1l2.3.9 2-3.4-2-1.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>

    <span class="nav-btn__label">Settings</span>
  </a>

</nav>
  </div>
  </body>
  </html>
